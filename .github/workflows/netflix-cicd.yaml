name: Build and push docker image.

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

# Login to ECR
#=============
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v4


    - name: Docker build 
      run: |
        docker build -t movie-backend .

    - name: Docker push
      run: |
        docker tag movie-backend:latest 850919910503.dkr.ecr.eu-north-1.amazonaws.com/movie-backend:latest
        docker tag movie-backend:latest 850919910503.dkr.ecr.eu-north-1.amazonaws.com/movie-backend:latest:v${{github.run_number}}
        docker push 850919910503.dkr.ecr.eu-north-1.amazonaws.com/movie-backend:latest
        docker push 850919910503.dkr.ecr.eu-north-1.amazonaws.com/movie-backend:latest:v${{github.run_number}}